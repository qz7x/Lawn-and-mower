<title>Blade &amp; Brew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--ink:#f4ecd8;--dim:#b9ad92;--amber:#f2a900;--amber2:#ffcf4d;--grass:#79c63f;--red:#e5482d;--panel:rgba(20,17,12,.72);--line:rgba(255,226,160,.18);color-scheme:dark;
 --display:'Alfa Slab One','Rockwell','Georgia',serif;--ui:'Barlow Condensed','Oswald','Arial Narrow',system-ui,sans-serif;--body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{margin:0;height:100%;background:#0d0b08;color:var(--ink);overflow:hidden;font:14px/1.45 var(--body)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(10,6,0,.55) 100%);z-index:2}
#warm{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 50%,rgba(255,170,40,.0) 40%,rgba(255,150,30,.35) 100%);opacity:0;transition:opacity .6s}
[hidden]{display:none!important}
.hud{position:fixed;z-index:5;pointer-events:none;font-family:var(--ui);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.glass{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px}
#top{top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;min-width:240px;padding:8px 18px 10px}
#timer{font:700 40px/1 var(--ui);letter-spacing:.06em}
#pctbar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 2px}
#pctfill{height:100%;width:0;background:linear-gradient(90deg,#5aa826,#a5e04a);transition:width .25s}
#pcttxt{font-size:15px;color:var(--dim)}
#board{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));min-width:190px;padding:8px 12px}
#board div{display:flex;gap:8px;align-items:center;font-size:17px;padding:1px 0}
#board i{width:11px;height:11px;border-radius:3px;display:inline-block}
#board b{margin-left:auto;font-weight:600;color:var(--amber2)}
#roomtag{font-size:13px;color:var(--dim);margin-bottom:3px}
#gauges{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));padding:10px 14px;min-width:230px}
#spdrow{display:flex;align-items:baseline;gap:6px}#spd{font:700 46px/1 var(--ui)}#spdrow i{font-style:normal;color:var(--dim);font-size:16px}
.g{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center;font-size:14px;color:var(--dim);margin-top:5px}
.g .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}.g .bar b{display:block;height:100%;width:50%;background:var(--amber);transition:width .2s}
.g output{color:var(--ink);text-align:right}
#bagmode{margin-top:6px;font-size:13px;color:var(--dim)}#bagmode b{color:var(--grass)}
#drink{left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:18px;padding:8px 16px;align-items:center}
.can{width:20px;height:38px;border-radius:5px 5px 4px 4px;background:linear-gradient(90deg,#b8800c,#f6d365 40%,#c99510);position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.can u{position:absolute;left:0;right:0;bottom:0;background:rgba(40,20,0,.78);height:0;transition:height .3s}
.can i{position:absolute;left:0;right:0;top:14px;height:10px;background:#7a1212}
.stat{font-size:14px;color:var(--dim);line-height:1.15}.stat b{display:block;color:var(--ink);font-size:20px}
.cigar{width:56px;height:9px;border-radius:5px;background:linear-gradient(#7a4a26,#4b2c14);position:relative;overflow:visible}
.cigar em{position:absolute;right:-3px;top:-1px;width:9px;height:11px;border-radius:50%;background:#ff5a1a;box-shadow:0 0 10px 2px rgba(255,100,20,.8);opacity:.6}
#mini{right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));padding:6px}
#mini canvas{display:block;width:176px;height:176px;border-radius:6px;image-rendering:pixelated}
#toast{left:50%;top:22%;transform:translateX(-50%);font:700 30px/1.1 var(--ui);text-align:center;opacity:0;transition:opacity .35s;white-space:nowrap}
#count{left:50%;top:38%;transform:translate(-50%,-50%);font:400 150px/1 var(--display);color:var(--amber2);opacity:0;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#hint{left:50%;top:136px;transform:translateX(-50%);font-size:15px;color:var(--ink);opacity:.85;text-align:center;transition:opacity 1s;white-space:nowrap}
.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 background:linear-gradient(180deg,rgba(8,6,3,.25),rgba(8,6,3,.72));overflow:auto}
.card{width:min(560px,100%);padding:26px 28px;background:rgba(18,15,10,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.title{font:400 clamp(40px,8vw,66px)/.95 var(--display);color:var(--amber2);margin:0;letter-spacing:.01em}
.title span{color:var(--grass)}
.sub{font:600 18px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:8px 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
button.btn{font:700 20px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#1a1305;background:linear-gradient(#ffd75a,#f2a900);border:0;border-radius:9px;padding:12px 18px;cursor:pointer;box-shadow:0 3px 0 #9a6a00,0 8px 18px rgba(0,0,0,.4);text-align:left}
button.btn:hover{filter:brightness(1.08)}button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a00}
button.btn.alt{color:var(--ink);background:linear-gradient(#3b342a,#2a251d);box-shadow:0 3px 0 #14100a,0 8px 18px rgba(0,0,0,.4)}
button.btn small{display:block;font:500 13px var(--body);letter-spacing:0;text-transform:none;opacity:.75;margin-top:1px}
button.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
label.f{display:block;font:600 14px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
input.t,select.t,textarea.t{width:100%;box-sizing:border-box;background:#120f0a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:15px var(--body)}
textarea.t{height:84px;font:12px ui-monospace,Menlo,monospace;resize:vertical}
.sw{display:flex;gap:8px}.sw button{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer}.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;color:var(--dim)}.keys b{color:var(--ink);font:600 15px var(--ui);letter-spacing:.06em}
.muted{color:var(--dim);font-size:13px}.ok{color:var(--grass)}.warn{color:var(--amber2)}.bad{color:#ff7a63}
.list{margin:8px 0 0;padding:0;list-style:none}.list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font:600 20px var(--ui);letter-spacing:.04em}.list li b{margin-left:auto;color:var(--amber2)}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.tabs button{flex:1;min-width:120px;font:700 16px var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:#1b1710;color:var(--dim);cursor:pointer}.tabs button[aria-selected=true]{background:var(--amber);color:#1a1305}
a{color:var(--amber2)}
@media (max-width:640px){#board{top:auto;bottom:210px}#mini canvas{width:120px;height:120px}#gauges{min-width:190px}#count{font-size:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="c" tabindex="0"></canvas>
<div id="fx"></div><div id="warm"></div>
<div id="hud" hidden>
  <div id="top" class="hud glass"><div id="roomtag" hidden></div><div id="timer">3:00</div><div id="pctbar"><div id="pctfill"></div></div><div id="pcttxt">0% mowed</div></div>
  <div id="board" class="hud glass" hidden></div>
  <div id="gauges" class="hud glass">
    <div id="spdrow"><span id="spd">0</span><i>km/h</i></div>
    <div class="g"><span>Fuel</span><div class="bar"><b id="fuelbar"></b></div><output id="fuelv">100</output></div>
    <div class="g"><span>Bag</span><div class="bar"><b id="bagbar" style="background:var(--grass)"></b></div><output id="bagv">0</output></div>
    <div id="bagmode"></div>
  </div>
  <div id="drink" class="hud glass">
    <div class="can"><i></i><u id="canfill"></u></div>
    <div class="stat">Beer<b id="beerN">6</b></div>
    <div class="stat">Cigar<div class="cigar" id="cigar"><em id="ember"></em></div></div>
  </div>
  <div id="mini" class="hud glass"><canvas id="minic" width="256" height="256"></canvas></div>
  <div id="toast" class="hud"></div><div id="count" class="hud"></div>
  <div id="hint" class="hud"></div>
</div>
<div id="menu" class="menu" hidden></div>

// ---- PCG integer hash ---------------------------------------------------------------------------
uint pcg(uint v){

varying vec3  vFlat;
varying vec3  vTan;
varying vec2  vUv;
varying vec4  vTint;
varying vec4  vCan;
varying vec3  vCut;
varying float vCover;
varying float vFp;
#ifdef STALK
varying float vPart;
#endif

void main(){
  vec3  V  = normalize(cameraPosition - vWorld);
  float t  = vUv.x, s = vUv.y;
  float fp = vFp;
  float vis = 1.0 - smoothstep(0.15, 0.7, fp);

  vec3 N  = normalize(vNormal);
  vec3 Nf = normalize(vFlat);
  if (!gl_FrontFacing){ N = -N; Nf = -Nf; }
  N = normalize(mix(N, Nf, smoothstep(0.2, 0.9, fp)));           // flatten V-fold once sub-pixel
  float nv = dot(N, V);
  if (nv < 0.02) N = normalize(N + V * (0.02 - nv));

  float dry = vTint.x, hj = vTint.y, sp = vTint.z, rr = vTint.w;

  // ---- albedo: damp earth root -> etiolated sheath -> chlorophyll -> sun-bleached tip ------------------
  vec3 green = vec3(0.055, 0.200, 0.020) * vec3(1.0 + 0.30 * hj, 1.0 - 0.05 * hj, 1.0 - 0.30 * abs(hj));
  vec3 root  = mix(vec3(0.040, 0.026, 0.012), vec3(0.20, 0.15, 0.05), dry);
  vec3 sheath = vec3(0.20, 0.22, 0.07);
  vec3 tipC  = mix(vec3(0.28, 0.29, 0.05), vec3(0.50, 0.40, 0.14), dry);
  vec3 c = mix(root, sheath, smoothstep(0.0, 0.07, t));
  c = mix(c, green, smoothstep(0.06, 0.28, t));
  c = mix(c, tipC, pow(smoothstep(0.50, 1.0, t), 1.4) * mix(0.55, 1.0, dry));
  vec3 straw = mix(vec3(0.40, 0.27, 0.085), vec3(0.58, 0.45, 0.18), rr);
  c = mix(c, straw * (0.75 + 0.25 * (1.0 - t)), smoothstep(0.25, 0.95, dry) * 0.9);
  // mowed lawn: fresh-cut green ends, lanes alternate light/dark with the direction the mower travelled
  float cutK = vCut.x;
  c = mix(c, mix(green, vec3(0.30, 0.40, 0.07), 0.22), cutK * 0.85 * (1.0 - dry * 0.5));
  c *= mix(1.0, mix(0.72, 1.30, vCut.y), cutK);
  float rib = 0.0;
  float thick = 0.34;
  vec3  sigma = mix(vec3(3.1, 1.05, 4.4), vec3(0.9, 1.2, 2.7), dry);
  float isStalk = 0.0;
#ifdef STALK
  isStalk = 1.0;
  float part = vPart;
  vec3 culm = mix(vec3(0.16, 0.20, 0.05), vec3(0.45, 0.34, 0.11), smoothstep(0.35, 0.9, t) * 0.7 + dry * 0.4);
  vec3 head = mix(vec3(0.40, 0.31, 0.10), vec3(0.56, 0.40, 0.18), rr) * (0.8 + 0.4 * hj);
  head = mix(head, vec3(0.30, 0.12, 0.16), 0.20 * step(0.7, rr));                     // occasional purple-tinged heads
  c = part < 0.5 ? culm : head;
  thick = part < 0.5 ? 0.30 : (part < 1.5 ? 0.14 : 0.05);
  rib = 0.0;
#else
  rib = exp(-s * s / 0.045) * vis;
  float veins = 0.5 + 0.5 * sin(s * 22.0 + rr * 30.0);
  c *= 1.0 + vis * 0.10 * (veins - 0.5);
  c = mix(c, c * vec3(1.30, 1.22, 0.85) + vec3(0.012, 0.012, 0.0), rib * 0.55);
  thick = 0.34 * (1.0 - 0.45 * s * s) * (1.0 - 0.55 * t) * (1.0 + 0.7 * rib);
  thick = mix(thick, 0.55, step(2.5, sp) * step(sp, 3.5));                           // thatch is thick & papery
#endif

  // ---- canopy occlusion: ambient AO + golden-hour grazing sun attenuation through the stand -------------
  float hy = vCan.x, cd = vCan.y, dens = vCan.z;
  float rel = clamp(hy / (cd * 0.85 + 0.03), 0.0, 1.0);
  float ao  = mix(0.10, 1.0, pow(rel, 0.75)) * mix(0.70, 1.0, clamp(vCan.w, 0.0, 1.0));
  ao = mix(ao, 0.88, cutK * 0.9);                                                        // mowed turf is open to the sky, not buried in a canopy
  float sinEl = max(uSunDir.y, 0.12);
  float sunVis = exp(-2.4 * dens * max(cd - hy, 0.0) / sinEl);
  sunVis = mix(sunVis, 1.0, isStalk);                                                   // stalks stand above the canopy
  float blob = blobShade(vWorld.xz);
  sunVis *= (1.0 - 0.75 * blob) * mix(1.0, 0.2, vCut.z);
  ao *= 1.0 - 0.3 * blob;

  Leaf L;
  L.albedo = c; L.N = N; L.T = vTan; L.sigma = sigma; L.thick = thick;
  L.rough = 0.42; L.rib = rib; L.ao = mix(ao, 1.0, isStalk * 0.7); L.sunVis = sunVis; L.fp = fp;
  L.tint = mix(vec3(1.0), c * 5.0, 0.35) * vec3(1.0, 1.0, 0.6);
  vec3 col = shadeLeaf(L, V);

#ifndef STALK
  // Dew: droplets strung along the blade; each is a tiny lens that mirrors the sky and flashes the sun.
  if (uDew > 0.01 && fp < 0.16){
    float hy2 = vCan.x;
    vec3 b = dewBeads(vec2(s * 0.85 + rr * 7.0, hy2 / 0.0050 + rr * 13.0), rr, fp);
    if (b.x > 0.0){
      vec3 lat = normalize(cross(N, vTan));
      vec2 e = b.yz * 0.85;
      vec3 Nb = normalize(N * sqrt(max(1.0 - dot(e, e), 0.05)) + lat * e.x + normalize(vTan) * e.y);
      vec3 H = normalize(uSunDir + V);
      float glint = pow(clamp(dot(Nb, H), 0.0, 1.0), 180.0) * 6.0;
      vec3 Rb = reflect(-V, Nb);
      vec3 env = skyRadiance(normalize(vec3(Rb.x, max(Rb.y, 0.03), Rb.z)));
      vec3 Tb = refract(-V, Nb, 0.75);                                   // lens: shows the (inverted) bright background
      vec3 bg = skyRadiance(normalize(vec3(-Tb.x, abs(Tb.y) + 0.05, -Tb.z))) * 0.9 + uSunCol * 0.10 * sunVis;
      float Fb = F_Schlick(clamp(dot(Nb, V), 0.0, 1.0), 0.02);
      float rim = smoothstep(0.55, 1.0, dot(b.yz, b.yz));               // dark refractive rim
      vec3 body = c * (skyAmbient(N) * 1.6 + uSunCol * sunVis * 0.5) + bg * 1.1;            // magnified leaf + background through water
      vec3 bead = mix(body, bg * 0.12 + c * 0.1, rim) + env * (0.10 + 1.8 * Fb) + uSunCol * glint * sunVis;
      col = mix(col, bead, clamp(uDew, 0.0, 1.0) * b.x * smoothstep(0.30, 0.75, rel) * 0.9);
    }
  }
#endif

#ifndef STALK
  // Distance anti-aliasing: once a blade is thinner than ~a pixel its per-blade luminance is noise, so converge
  // to the analytic canopy colour (identical to the soil's far field) instead of letting it glitter.
  float farK = smoothstep(0.35, 1.6, fp) * 0.9;
  if (farK > 0.001) col = mix(col, canopyShade(vWorld, V, vec3(0.0, 1.0, 0.0), texture(uField, fieldUV(vWorld.xz)), vCut.xy), farK);
#endif

  col = applyFog(col, vWorld);
  gl_FragColor = vec4(col, vCover);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}

uniform vec4 uRing;
uniform vec4 uRingB;
uniform float uSalt;
varying vec3  vWorld;
varying vec3  vNormal;
varying vec2  vUv;

void cullIt(){ gl_Position = vec4(2.0, 2.0, 2.0, 1.0); vWorld = vec3(0.0); vNormal = vec3(0.0, 1.0, 0.0); vUv = vec2(0.0); vInfo = vec4(0.0); }

void main(){
  uint  id    = uint(gl_InstanceID);
  uint  bpc   = uint(uRingB.x + 0.5);
  uint  gN    = uint(uRingB.y + 0.5);
  uint  cellI = id / bpc;
  uint  k     = id - cellI * bpc;
  ivec2 cl    = ivec2(int(cellI % gN), int(cellI / gN)) - ivec2(int(gN) / 2);
  float cs    = uRing.w;
  ivec2 cell  = cl + ivec2(floor(cameraPosition.xz / cs));
  uint  bs    = pcg(ihash(cell, uint(uSalt)) + k * 2654435769u + 0x27D4EB2Fu);

  vec2 root = (vec2(cell) + vec2(rnd(bs, 1u), rnd(bs, 2u))) * cs;
  float d    = distance(root, cameraPosition.xz);
  float keep = 1.0 - smoothstep(uRing.y - uRing.z, uRing.y + uRing.z, d);
  if (rnd(bs, 9u) > keep){ cullIt(); return; }

  vec4  f  = textureLod(uField, fieldUV(root), 0.0);
  float pc = smoothstep(0.12, 0.85, f.y);
  if (rnd(bs, 3u) > pc){ cullIt(); return; }

  float iny = inYard(root);
  vec4  ym  = iny > 0.5 ? textureLod(uYard, yardUV(root), 0.0) : vec4(0.0);
  if (ym.r > 0.5 || ym.g > 0.5 || ym.b > 0.3){ cullIt(); return; }
  float cutK = iny > 0.5 ? smoothstep(0.22, 0.40, textureLod(uCut, yardUV(root), 0.0).r) : 0.0;
  float gy = terrain(root).x;
  vec4  cr = projectionMatrix * viewMatrix * vec4(root.x, gy, root.y, 1.0);
  if (cr.w < -1.0 || abs(cr.x) > cr.w * 1.3 + projectionMatrix[0][0] * 0.6){ cullIt(); return; }

  float sz  = (0.034 + 0.034 * rnd(bs, 4u)) * (0.8 + 0.4 * f.w) * mix(1.0, 0.5, cutK);
  float yaw = 6.2831853 * rnd(bs, 5u);
  float cy = cos(yaw), sy = sin(yaw);
  float tl = 0.45 * (rnd(bs, 8u) - 0.35), ct = cos(tl), st = sin(tl);
  mat3  R  = mat3(cy, 0.0, -sy,  0.0, 1.0, 0.0,  sy, 0.0, cy) * mat3(1.0, 0.0, 0.0,  0.0, ct, st,  0.0, -st, ct);

  float y01 = clamp(position.y, 0.0, 1.2);
  vec2  wd  = normalize(uWindDir);
  float gust = windGust(root);
  float S  = y01 * y01 * (1.4 - 0.4 * y01), dS = y01 * (2.8 - 1.2 * y01);
  float ph = rnd(bs, 6u) * 6.2831853;
  float fl = sin(9.0 * uTime + ph + 4.0 * y01), dfl = 4.0 * cos(9.0 * uTime + ph + 4.0 * y01);
  float amp = 0.30 * uWindAmt * gust;
  vec2  off = wd * (amp * S) + vec2(-wd.y, wd.x) * (0.05 * uWindAmt * (0.3 + gust) * y01 * y01 * fl);
  vec2  a   = wd * (amp * dS) + vec2(-wd.y, wd.x) * (0.05 * uWindAmt * (0.3 + gust) * (2.0 * y01 * fl + y01 * y01 * dfl));

  vec3 lp = R * position;
  vec3 P  = vec3(root.x, gy, root.y) + sz * (lp + vec3(off.x, 0.0, off.y));
  gl_Position = projectionMatrix * viewMatrix * vec4(P, 1.0);

  vec3 n = R * normal;
  n -= vec3(0.0, 1.0, 0.0) * dot(vec3(a.x, 0.0, a.y), n);        // analytic J^-T n for d = d(y)
  vWorld = P; vNormal = n; vUv = uv;
  vInfo = vec4(P.y - gy, mix(0.6, 1.5, f.w), rnd(bs, 7u), sz);
}

varying vec3 vWorld;
varying vec3 vNg;

float h2f(vec2 i){ uvec2 q = uvec2(ivec2(i)); return u01(pcg(q.x + pcg(q.y))); }

// Value noise with analytic derivatives: (n, dn/dx, dn/dy)
vec3 vnoiseD(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u  = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  vec2 du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  float a = h2f(i), b = h2f(i + vec2(1.0, 0.0)), c = h2f(i + vec2(0.0, 1.0)), d = h2f(i + vec2(1.0, 1.0));
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1 * u.x + k2 * u.y + k4 * u.x * u.y, du.x * (k1 + k4 * u.y), du.y * (k2 + k4 * u.x));
}
// Micro-relief fbm with octaves faded out by pixel footprint (no shimmer). returns (h, dh/dx, dh/dz), h~0..1
vec3 relief(vec2 p, float fw){
  float fq = 2.2, a = 0.5;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 7; i++){
    float fade = 1.0 - smoothstep(0.30, 0.85, fw * fq);
    vec3 n = vnoiseD(p * fq + float(i) * 17.3);
    acc += a * fade * vec3(n.x, n.y * fq, n.z * fq);
    fq *= 2.07; a *= 0.5;
  }
  return acc;
}
// Pebbles: one dome per cell, contained in its cell. Returns (height m, dh/dx, dh/dz, mask)
vec4 pebbles(vec2 p, float scale, float fw, float density, float seed){
  vec2 q = p * scale; ivec2 ci = ivec2(floor(q)); vec2 lp = fract(q);
  uint h = ihash(ci, uint(seed));
  float fade = 1.0 - smoothstep(0.05, 0.16, fw * scale);
  if (u01(h) > density || fade <= 0.0) return vec4(0.0);
  vec2 c = vec2(0.30 + 0.40 * u01(pcg(h ^ 1u)), 0.30 + 0.40 * u01(pcg(h ^ 2u)));
  float r = 0.11 + 0.12 * u01(pcg(h ^ 3u));
  vec2 dp = lp - c;
  float k = r * r - dot(dp, dp);
  if (k <= 0.0) return vec4(0.0);
  float hh = 0.5 * k / r / scale;
  vec2 g = -0.55 * dp / r;
  float mask = clamp(k / (r * max(fw * scale, 1e-3) * 1.2), 0.0, 1.0) * fade;
  return vec4(hh * fade, g * fade, mask);
}
// Straw slivers / leaf fragments: one oriented capsule per (rotated) cell, fully contained in the cell.
vec4 litter(vec2 p, float scale, float rot, float fw, float seed, float lenK, float widK){
  float cr = cos(rot), sr = sin(rot);
  vec2 pr = vec2(cr * p.x - sr * p.y, sr * p.x + cr * p.y) * scale;
  ivec2 ci = ivec2(floor(pr)); vec2 lp = fract(pr);
  uint h = ihash(ci, uint(seed));
  float fade = 1.0 - smoothstep(0.05, 0.18, fw * scale);
  if (u01(h) > 0.50 || fade <= 0.0) return vec4(0.0);
  float ang = 6.2831853 * u01(pcg(h ^ 1u));
  vec2  dir = vec2(cos(ang), sin(ang));
  vec2  c   = vec2(0.36 + 0.28 * u01(pcg(h ^ 2u)), 0.36 + 0.28 * u01(pcg(h ^ 3u)));
  float hl  = (0.14 + 0.14 * u01(pcg(h ^ 4u))) * lenK;
  float wd  = (0.012 + 0.020 * u01(pcg(h ^ 5u))) * widK;
  vec2  dp  = lp - c;
  float along = clamp(dot(dp, dir), -hl, hl);
  float dist = length(dp - dir * along) / scale;                 // metres
  float wm = wd / scale;
  float cov = clamp(0.5 + (wm - dist) / max(fw, 1e-4), 0.0, 1.0) * clamp(2.0 * wm / max(fw, 1e-4), 0.0, 1.0) * fade;
  float shadow = clamp(0.5 + (wm * 2.6 - dist) / max(fw, 1e-4), 0.0, 1.0) * fade;
  return vec4(cov, shadow, u01(pcg(h ^ 6u)), u01(pcg(h ^ 7u)));
}

float D_GGX(float NoH, float a){ float a2 = a * a; float d = NoH * NoH * (a2 - 1.0) + 1.0; return a2 / (PI * d * d + 1e-7); }
float V_Smith(float NoV, float NoL, float a){
  float gv = NoL * (NoV * (1.0 - a) + a), gl = NoV * (NoL * (1.0 - a) + a);
  return 0.5 / (gv + gl + 1e-5);
}
float F_Schlick(float VoH, float f0){ return f0 + (1.0 - f0) * pow(1.0 - VoH, 5.0); }

void main(){
  vec3  P = vWorld; vec2 p = P.xz;
  vec3  V = normalize(cameraPosition - P);
  float dist = length(cameraPosition - P);
  float fw = max(length(vec2(length(dFdx(p)), length(dFdy(p)))), 1e-4);
  vec4  f = texture(uField, fieldUV(p));
  vec3  L = uSunDir;
  vec2  wd = normalize(uWindDir);

  // ---------------- macro layers ----------------
  float mA = texture(uNoise, p * 0.0310 + 0.30).g;
  float mB = texture(uNoise, p * 0.0074 + 0.10).r;
  float mC = texture(uNoise, p * 0.0170 + 0.50).b;
  vec3 loam  = vec3(0.060, 0.040, 0.025);
  vec3 humus = vec3(0.028, 0.021, 0.014);
  vec3 sand  = vec3(0.165, 0.125, 0.082);
  vec3 soil  = mix(loam, humus, smoothstep(0.42, 0.68, mB));
  soil = mix(soil, sand, smoothstep(0.55, 0.72, mA) * 0.75);

  // ---------------- micro-relief (analytic gradient) ----------------
  vec3  rl = relief(p, fw);
  float relH = (rl.x - 0.5) * 0.075;
  vec2  grad = rl.yz * 0.075;
  vec4  pb1 = pebbles(p, 9.0, fw, 0.16, 3.0);
  vec4  pb2 = pebbles(p + 11.7, 24.0, fw, 0.26, 9.0);
  vec3  pebCol1 = mix(vec3(0.16, 0.14, 0.11), vec3(0.28, 0.22, 0.15), u01(ihash(ivec2(floor(p * 9.0)), 31u)));
  vec3  pebCol2 = mix(vec3(0.12, 0.11, 0.09), vec3(0.22, 0.19, 0.14), u01(ihash(ivec2(floor((p + 11.7) * 24.0)), 37u)));
  grad += pb1.yz * pb1.w + pb2.yz * pb2.w;
  float heightAll = relH + pb1.x * pb1.w + pb2.x * pb2.w;

  // grain / clods
  // crumb structure: each octave is faded by its own wavelength vs the pixel footprint (no aliasing / no sparkle)
  vec3  cr1 = vnoiseD(p * 38.0 + 3.1), cr2 = vnoiseD(p * 91.0 + 7.7);
  float cf1 = 1.0 - smoothstep(0.18, 0.55, fw * 38.0), cf2 = 1.0 - smoothstep(0.18, 0.55, fw * 91.0);
  float grain = (0.62 + 0.76 * rl.x) * (1.0 + ((cr1.x - 0.5) * cf1 + (cr2.x - 0.5) * cf2) * 0.7);
  grad += (cr1.yz * 38.0 * cf1 + cr2.yz * 91.0 * cf2) * 0.002;
  vec3 albedo = soil * grain;

  // ---------------- moisture ----------------
  float low  = smoothstep(0.3, -1.1, P.y);
  float wet  = clamp(low * 0.45 + (mC - 0.52) * 1.3 + 0.10 * f.w, 0.0, 1.0);
  wet = clamp(wet + clamp(-relH * 22.0, 0.0, 0.25) * wet, 0.0, 1.0);
  float puddle = smoothstep(0.80, 0.93, wet) * (1.0 - smoothstep(0.0, 0.02, relH + 0.0));
  float rough = mix(0.93, 0.42, wet);

  // moss / algae film in persistently damp soil

  albedo = mix(albedo, vec3(0.030, 0.070, 0.016) * (0.7 + 0.6 * rl.x), moss * 0.7);

  // pebbles
  albedo = mix(albedo, pebCol1, pb1.w * step(0.0001, pb1.x));
  albedo = mix(albedo, pebCol2, pb2.w * step(0.0001, pb2.x));
  rough  = mix(rough, 0.55, max(pb1.w, pb2.w));

  // ---------------- organic litter ----------------
  vec4 lt1 = litter(p, 5.5, 0.4, fw, 21.0, 1.0, 1.0);                                    // straw slivers

#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(10,6,0,.55) 100%);z-index:2}
#warm{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 50%,rgba(255,170,40,.0) 40%,rgba(255,150,30,.35) 100%);opacity:0;transition:opacity .6s}
[hidden]{display:none!important}
.hud{position:fixed;z-index:5;pointer-events:none;font-family:var(--ui);letter-spacing:.04em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.glass{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px}
#top{top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);text-align:center;min-width:240px;padding:8px 18px 10px}
#timer{font:700 40px/1 var(--ui);letter-spacing:.06em}
#pctbar{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 2px}
#pctfill{height:100%;width:0;background:linear-gradient(90deg,#5aa826,#a5e04a);transition:width .25s}
#pcttxt{font-size:15px;color:var(--dim)}
#board{top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));min-width:190px;padding:8px 12px}
#board div{display:flex;gap:8px;align-items:center;font-size:17px;padding:1px 0}
#board i{width:11px;height:11px;border-radius:3px;display:inline-block}
#board b{margin-left:auto;font-weight:600;color:var(--amber2)}
#roomtag{font-size:13px;color:var(--dim);margin-bottom:3px}
#gauges{left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));padding:10px 14px;min-width:230px}
#spdrow{display:flex;align-items:baseline;gap:6px}#spd{font:700 46px/1 var(--ui)}#spdrow i{font-style:normal;color:var(--dim);font-size:16px}
.g{display:grid;grid-template-columns:54px 1fr 40px;gap:8px;align-items:center;font-size:14px;color:var(--dim);margin-top:5px}
.g .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}.g .bar b{display:block;height:100%;width:50%;background:var(--amber);transition:width .2s}
.g output{color:var(--ink);text-align:right}
#bagmode{margin-top:6px;font-size:13px;color:var(--dim)}#bagmode b{color:var(--grass)}
#drink{left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:18px;padding:8px 16px;align-items:center}
.can{width:20px;height:38px;border-radius:5px 5px 4px 4px;background:linear-gradient(90deg,#b8800c,#f6d365 40%,#c99510);position:relative;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.can u{position:absolute;left:0;right:0;bottom:0;background:rgba(40,20,0,.78);height:0;transition:height .3s}
.can i{position:absolute;left:0;right:0;top:14px;height:10px;background:#7a1212}
.stat{font-size:14px;color:var(--dim);line-height:1.15}.stat b{display:block;color:var(--ink);font-size:20px}
.cigar{width:56px;height:9px;border-radius:5px;background:linear-gradient(#7a4a26,#4b2c14);position:relative;overflow:visible}
.cigar em{position:absolute;right:-3px;top:-1px;width:9px;height:11px;border-radius:50%;background:#ff5a1a;box-shadow:0 0 10px 2px rgba(255,100,20,.8);opacity:.6}
#mini{right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));padding:6px}
#mini canvas{display:block;width:176px;height:176px;border-radius:6px;image-rendering:pixelated}
#toast{left:50%;top:22%;transform:translateX(-50%);font:700 30px/1.1 var(--ui);text-align:center;opacity:0;transition:opacity .35s;white-space:nowrap}
#count{left:50%;top:38%;transform:translate(-50%,-50%);font:400 150px/1 var(--display);color:var(--amber2);opacity:0;text-shadow:0 6px 30px rgba(0,0,0,.7)}
#hint{left:50%;top:136px;transform:translateX(-50%);font-size:15px;color:var(--ink);opacity:.85;text-align:center;transition:opacity 1s;white-space:nowrap}
.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
 background:linear-gradient(180deg,rgba(8,6,3,.25),rgba(8,6,3,.72));overflow:auto}
.card{width:min(560px,100%);padding:26px 28px;background:rgba(18,15,10,.82);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55)}
.title{font:400 clamp(40px,8vw,66px)/.95 var(--display);color:var(--amber2);margin:0;letter-spacing:.01em}
.title span{color:var(--grass)}
.sub{font:600 18px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:8px 0 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}
button.btn{font:700 20px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#1a1305;background:linear-gradient(#ffd75a,#f2a900);border:0;border-radius:9px;padding:12px 18px;cursor:pointer;box-shadow:0 3px 0 #9a6a00,0 8px 18px rgba(0,0,0,.4);text-align:left}
button.btn:hover{filter:brightness(1.08)}button.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #9a6a00}
button.btn.alt{color:var(--ink);background:linear-gradient(#3b342a,#2a251d);box-shadow:0 3px 0 #14100a,0 8px 18px rgba(0,0,0,.4)}
button.btn small{display:block;font:500 13px var(--body);letter-spacing:0;text-transform:none;opacity:.75;margin-top:1px}
button.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
label.f{display:block;font:600 14px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px}
input.t,select.t,textarea.t{width:100%;box-sizing:border-box;background:#120f0a;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:15px var(--body)}
textarea.t{height:84px;font:12px ui-monospace,Menlo,monospace;resize:vertical}
.sw{display:flex;gap:8px}.sw button{width:34px;height:34px;border-radius:8px;border:2px solid transparent;cursor:pointer}.sw button[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;color:var(--dim)}.keys b{color:var(--ink);font:600 15px var(--ui);letter-spacing:.06em}
.muted{color:var(--dim);font-size:13px}.ok{color:var(--grass)}.warn{color:var(--amber2)}.bad{color:#ff7a63}
.list{margin:8px 0 0;padding:0;list-style:none}.list li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font:600 20px var(--ui);letter-spacing:.04em}.list li b{margin-left:auto;color:var(--amber2)}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.tabs button{flex:1;min-width:120px;font:700 16px var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:#1b1710;color:var(--dim);cursor:pointer}.tabs button[aria-selected=true]{background:var(--amber);color:#1a1305}
a{color:var(--amber2)}
@media (max-width:640px){#board{top:auto;bottom:210px}#mini canvas{width:120px;height:120px}#gauges{min-width:190px}#count{font-size:110px}}
